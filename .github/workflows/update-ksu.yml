name: Update KernelSU-Next

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout kernel
      uses: actions/checkout@v4
      with:
        ref: 23.2
        fetch-depth: 1

    - name: Remove old KSU driver
      run: |
        rm -rf drivers/kernelsu
        sed -i '/kernelsu/d' drivers/Makefile
        sed -i '/kernelsu/d' drivers/Kconfig

    - name: Integrate KernelSU-Next v3.4.0
      run: |
        git clone --depth 1 --branch v3.4.0 https://github.com/KernelSU-Next/KernelSU-Next.git /tmp/ksu-src
        mkdir -p drivers/kernelsu
        cp -a /tmp/ksu-src/kernel/. drivers/kernelsu/
        grep -q "kernelsu" drivers/Makefile || echo "obj-$(CONFIG_KSU) += kernelsu/" >> drivers/Makefile
        sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
        ls drivers/kernelsu/

    - name: Enable KSU in defconfig
      run: |
        sed -i '/CONFIG_KSU/d; /SUSFS/d' arch/arm64/configs/sweet_defconfig
        echo "CONFIG_KSU=y" >> arch/arm64/configs/sweet_defconfig
        grep -E "CONFIG_KSU|KPROBES|KALLSYMS_ALL" arch/arm64/configs/sweet_defconfig

    - name: Commit
      run: |
        git config user.name "hrihq"
        git config user.email "hrihq@users.noreply.github.com"
        git add -A
        git commit -m "KernelSU-Next: integrate v3.4.0, drop legacy driver" || echo "nothing to commit"
        git push "https://hrihq:${{ secrets.GH_TOKEN }}@github.com/hrihq/D-77-kernel.git" HEAD:23.2
